name: Docker

on:
    push:
        branches:
            - main

env:
    REGISTRY: ghcr.io
    IMAGE_OWNER: salavion

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push server
              uses: docker/build-push-action@v6
              with:
                  context: ./server
                  file: ./server/Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ env.IMAGE_OWNER }}/workswap-server:latest
                      ghcr.io/${{ env.IMAGE_OWNER }}/workswap-server:${{ github.sha }}

            - name: Build and push statistics
              uses: docker/build-push-action@v6
              with:
                  context: ./statistics
                  file: ./statistics/Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ env.IMAGE_OWNER }}/workswap-statistics:latest
                      ghcr.io/${{ env.IMAGE_OWNER }}/workswap-statistics:${{ github.sha }}